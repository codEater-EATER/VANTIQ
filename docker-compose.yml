version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: vantiq-postgres
    environment:
      POSTGRES_USER: vantiq_user
      POSTGRES_PASSWORD: vantiq_password
      POSTGRES_DB: vantiq
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    networks:
      - vantiq-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vantiq_user']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: vantiq-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - vantiq-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vantiq-backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://vantiq_user:vantiq_password@postgres:5432/vantiq
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      BACKEND_PORT: 3001
      LOG_LEVEL: debug
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vantiq-network
    volumes:
      - ./apps/backend:/app/apps/backend
    command: sh -c "npm run prisma:migrate && npm start"

  # Frontend (Next.js)
  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: vantiq-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NODE_ENV: production
    ports:
      - '3000:3000'
    depends_on:
      - backend
    networks:
      - vantiq-network

  # PgAdmin (Database Management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: vantiq-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@vantiq.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    networks:
      - vantiq-network
    depends_on:
      - postgres

  # Monitoring with Prometheus (Optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: vantiq-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - '9090:9090'
    networks:
      - vantiq-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  # Grafana Dashboards (Optional)
  grafana:
    image: grafana/grafana:latest
    container_name: vantiq-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
    ports:
      - '3002:3000'
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - vantiq-network
    depends_on:
      - prometheus

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: vantiq-nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - vantiq-network
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  vantiq-network:
    driver: bridge
